<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9f6" />
    <meta name="description" content="하루는 가볍게, 한 주는 한눈에. 나만의 주간 플래너 Daynote." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Daynote · 나의 주간 플래너</title>
    <style>
      body{margin:0}.boot{min-height:100dvh;display:flex;background:#f7f9f6;font-family:system-ui}.boot aside{width:196px;padding:36px 22px;background:white;border-right:1px solid #e9ece6}.boot main{flex:1;padding:40px 5%}.boot b,.boot i{display:block;background:#e8eee8;border-radius:6px;animation:boot-pulse 1.3s ease-in-out infinite}.boot aside b{width:110px;height:28px;margin-bottom:48px}.boot aside i{height:18px;margin:24px 0}.boot header{height:30px;width:180px;margin-bottom:40px;background:#e8eee8;border-radius:6px}.boot section{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #e9ece6;border-radius:12px;overflow:hidden}.boot section div{min-height:290px;background:white;border-right:1px solid #e9ece6;padding:20px 12px}.boot section b{height:40px;margin-bottom:28px}.boot section i{height:40px;margin:12px 0}@keyframes boot-pulse{50%{opacity:.45}}@media(max-width:700px){.boot aside{display:none}.boot main{padding:28px 16px}.boot section{grid-template-columns:repeat(2,1fr)}.boot section div:nth-child(n+3){display:none}}@media(prefers-reduced-motion:reduce){.boot b,.boot i{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Daynote를 열고 있어요"><aside aria-hidden="true"><b></b><i></i><i></i><i></i></aside><main aria-hidden="true"><header></header><section><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div><div><b></b><i></i><i></i></div></section></main></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
