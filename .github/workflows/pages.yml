name: Publish Daynote

# Publishing is explicit. A source push never publishes the app automatically.
on:
  workflow_dispatch:
    inputs:
      bundle_sha256:
        description: SHA-256 of the approved release manifest
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daynote-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify the approved artifact
        env:
          EXPECTED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: node scripts/release-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish approved version
        id: deployment
        uses: actions/deploy-pages@v4
